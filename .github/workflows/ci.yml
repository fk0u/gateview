name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    name: macOS (Swift app)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Self-check
        run: Tests/run.sh

  rust:
    name: Rust core (Windows/Linux engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Only the engine crates: the Tauri app needs GTK/WebKit and is built in its own jobs.
      - name: Tests (unit + Swift golden dataset)
        run: cargo test -p gateview-core -p gateview-providers
