name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    name: macOS (Swift app)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Self-check
        run: Tests/run.sh

  rust:
    name: Rust core (Windows/Linux engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Only the engine crates: the Tauri app needs GTK/WebKit and is built in its own jobs.
      - name: Tests (unit + Swift golden dataset)
        run: cargo test -p gateview-core -p gateview-providers

  windows:
    name: Windows (Tauri build + smoke test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Engine tests (incl. cfg(windows) providers)
        run: cargo test -p gateview-core -p gateview-providers
      - name: Build installers (.msi + setup .exe)
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles msi,nsis
      - name: Smoke test (launch 20 s, theme.json, screenshot)
        shell: pwsh
        run: |
          $exe = "target/release/gateview.exe"
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 15
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "GateView exited early with code $($p.ExitCode)" }
          $theme = Join-Path $env:APPDATA "com.alghani.gateview\theme.json"
          if (-not (Test-Path $theme)) { throw "theme.json was not created at $theme" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          # BitBlt with CAPTUREBLT: CopyFromScreen can't express the flag, and without it
          # transparent/layered windows like GateView are left out of the capture.
          Add-Type -Namespace Win32 -Name Cap -MemberDefinition @'
            [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern System.IntPtr GetDC(System.IntPtr hwnd);
            [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern int ReleaseDC(System.IntPtr hwnd, System.IntPtr dc);
            [System.Runtime.InteropServices.DllImport("gdi32.dll")] public static extern bool BitBlt(System.IntPtr dst, int x, int y, int w, int h, System.IntPtr src, int sx, int sy, int rop);
'@
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $dst = $g.GetHdc(); $src = [Win32.Cap]::GetDC([IntPtr]::Zero)
          [void][Win32.Cap]::BitBlt($dst, 0, 0, $b.Width, $b.Height, $src, $b.X, $b.Y, 0x00CC0020 -bor 0x40000000)
          [void][Win32.Cap]::ReleaseDC([IntPtr]::Zero, $src); $g.ReleaseHdc($dst); $g.Dispose()
          $bmp.Save("smoke-screenshot.png")
          Stop-Process $p
          Write-Host "GateView ran 20 s; theme.json at $theme"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateview-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            smoke-screenshot.png
          if-no-files-found: warn

  linux:
    name: Linux preview (.deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (WebKitGTK, GTK, tray, audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build packages
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: gateview-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
