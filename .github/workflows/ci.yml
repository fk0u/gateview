name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    name: macOS (Swift app)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Self-check
        run: Tests/run.sh

  rust:
    name: Rust core (Windows/Linux engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Only the engine crates: the Tauri app needs GTK/WebKit and is built in its own jobs.
      - name: Tests (unit + Swift golden dataset)
        run: cargo test -p gateview-core -p gateview-providers

  windows:
    name: Windows (Tauri build + smoke test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Engine tests (incl. cfg(windows) providers)
        run: cargo test -p gateview-core -p gateview-providers
      - name: Build installers (.msi + setup .exe)
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles msi,nsis
      - name: Smoke test (launch 35 s, theme.json, screenshot, logs)
        shell: pwsh
        run: |
          $exe = "target/release/gateview.exe"
          $p = Start-Process $exe -PassThru -RedirectStandardError gateview-stderr.log -RedirectStandardOutput gateview-stdout.log
          Start-Sleep -Seconds 30
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "GateView exited early with code $($p.ExitCode)" }
          $theme = Join-Path $env:APPDATA "com.alghani.gateview\theme.json"
          if (-not (Test-Path $theme)) { throw "theme.json was not created at $theme" }
          & .github/scripts/screenshot.ps1 smoke-screenshot.png
          Stop-Process $p
          Write-Host "---- GateView stderr ----"; Get-Content gateview-stderr.log -ErrorAction SilentlyContinue
          Write-Host "---- GateView stdout ----"; Get-Content gateview-stdout.log -ErrorAction SilentlyContinue
          Write-Host "GateView ran 35 s; theme.json at $theme"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateview-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            smoke-screenshot.png
            gateview-stderr.log
            gateview-stdout.log
          if-no-files-found: warn

  linux:
    name: Linux preview (.deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (WebKitGTK, GTK, tray, audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build packages
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: gateview-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
