    <text x="24" y="78" font-family="Helvetica Neue, Helvetica, Arial" font-size="30" font-weight="600" fill="#F4F6FB">Isya</text>
    <text x="360" y="80" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial" font-size="38" font-weight="300" fill="#7EE2A8">07:18</text>
    <g font-family="Helvetica Neue, Helvetica, Arial" font-size="12" fill="#F4F6FB" text-anchor="middle">
      <text x="56" y="128" fill-opacity=".55">Subuh</text><text x="56" y="148" fill-opacity=".55">04.34</text>
      <text x="124" y="128" fill-opacity=".55">Dzuhur</text><text x="124" y="148" fill-opacity=".55">11.56</text>
      <text x="192" y="128" fill-opacity=".55">Ashar</text><text x="192" y="148" fill-opacity=".55">15.14</text>
      <text x="260" y="128" fill-opacity=".55">Maghrib</text><text x="260" y="148" fill-opacity=".55">18.00</text>
