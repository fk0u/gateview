<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3550"/><stop offset=".55" stop-color="#1A2033"/><stop offset="1" stop-color="#0B0E18"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".2" r=".6">
      <stop offset="0" stop-color="#F08A3C" stop-opacity=".45"/><stop offset="1" stop-color="#F08A3C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC56B"/><stop offset="1" stop-color="#F08A3C"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="560" rx="28" fill="url(#sky)"/>
  <rect width="1280" height="560" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="560" rx="28" fill="url(#fade)"/>

  <!-- logo + wordmark -->
  <g transform="translate(84 92) scale(.36)" fill="none" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
