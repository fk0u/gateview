[package]
name = "gateview-providers"
description = "Per-platform service implementations (Now Playing, stats, OS helpers) behind cfg gates."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gateview-core = { path = "../gateview-core" }
serde = { version = "1", features = ["derive"] }
sysinfo = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
